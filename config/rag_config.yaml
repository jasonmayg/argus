# ARGUS Phase 2 RAG / Vector Store Configuration

embedder:
  # Default provider for all embed() calls. Override per-call via
  # core.embedder.get_embedder("<name>") if a specific scenario needs the
  # fallback (e.g. quality-sensitive backfill).
  default: sentence_transformer

  # If the default embedder raises EmbedderError, embed_with_fallback() tries
  # this provider. Set to null to disable fallback.
  fallback: openai

  providers:
    sentence_transformer:
      type: sentence_transformer
      model: all-MiniLM-L6-v2
      # Bump version when retraining or swapping model files. The new value
      # propagates into Chroma metadata so chroma_audit.py can flag rows that
      # were embedded with the old model.
      version: v1

    openai:
      type: openai
      model: text-embedding-3-small
      api_key_env: OPENAI_API_KEY
      version: v1

storage:
  # Chroma persistent dir. Gitignored.
  persist_dir: data/chroma_db

retrieval:
  # Default top_k for search_* methods. Individual callers can override.
  default_top_k: 10
  # Chroma returns squared L2 distance for normalized vectors. We filter out
  # results with distance > max_distance (1.0 ~ irrelevant; tighten for
  # higher precision, loosen for recall).
  max_distance: 1.2

collections:
  # Document length caps. Texts longer than this are trimmed before
  # embedding to avoid wasting context on boilerplate.
  news_max_chars: 1500
  alerts_max_chars: 800
  regulatory_max_chars: 2000

endpoints:
  # Per-endpoint RAG enablement. If `enabled: false`, the endpoint falls back
  # to its pre-RAG context loader. Useful as a kill-switch if retrieval
  # quality regresses.
  chat:
    enabled: true
    news_top_k: 5
    alerts_top_k: 3
    # Skip alerts collection retrieval if its count is below this — avoids
    # injecting noise when the snapshot is sparse.
    alerts_min_count: 5

  brief:
    enabled: true
    # Brief retrieves more news than chat — the LLM gets a single shot to
    # produce a 3-5 sentence summary, so we want broader coverage even at
    # the cost of some lower-relevance hits.
    news_top_k: 8
    alerts_top_k: 5
    alerts_min_count: 5
    # How many pipeline top-scored titles to splice into the retrieval
    # query. 0 disables pipeline-derived terms; the query falls back to
    # persona keywords only.
    pipeline_terms_max: 3

  actions:
    enabled: true
    # actions_history hits become few-shot examples — keep this small so
    # the prompt doesn't balloon past the model's effective attention
    # budget. Past three runs is usually enough to anchor style/scope.
    few_shot_top_k: 3
    # regulatory hits become "supporting evidence" the LLM can ground
    # its why_now sentences in.
    regulatory_top_k: 3
    # Skip few-shot block entirely until actions_history has been
    # populated for at least this many runs — embeds otherwise return
    # noisy matches against a near-empty collection.
    history_min_count: 5

  regulatory_search:
    # Phase 2F: /api/regulatory?q=<text> uses Chroma for semantic ranking
    # instead of SQL LIKE. With this off the endpoint falls back to a
    # title/raw_summary LIKE scan so the UI keeps working.
    enabled: true
    top_k: 20
    # If post-filter row count drops below `limit * retry_threshold` and
    # a metadata filter (country/category/severity/source) is active, the
    # endpoint reruns Chroma with `retry_top_k` candidates. This rescues
    # narrow filters that would otherwise under-serve the user — e.g. a
    # top-20 shortlist that happens to be all-USA when the user asked for
    # ?country=Mexico. Set `retry_top_k: 0` to disable the heuristic.
    retry_top_k: 80
    retry_threshold: 0.5
