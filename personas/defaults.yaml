# AI-generated baseline persona weights.
# To override, save a named profile via /api/save_profile.
# Profiles live in personas/profiles/ and are merged over these defaults
# in-memory when loaded — no floating config file is written.
#
# region_overrides: shallow diffs applied on top of the global risk_weights.
# Only keys that differ from global need to be listed.
# Effective weight = global value, overridden by matching region key where present.
#
# Weight philosophy:
#   >= 1.4  : Core focus for this persona — elevated sensitivity
#   1.0-1.3 : Standard monitoring
#   0.5-0.9 : Low relevance — will score below alert threshold in most cases
#   <= 0.4  : Not relevant — effectively filtered out for this persona

